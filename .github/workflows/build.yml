name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK (14.5)
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS14.5.sdk.tar.xz -o sdk.tar.xz
          tar -xf sdk.tar.xz -C $HOME/theos/sdks/

      - name: Build
        run: |
          make clean package

      - name: Prepare dylib
        run: |
          cp .theos/obj/SGCheat.dylib SGCheat.dylib || true
          # Also try to find it inside the staged layout
          find .theos -name "SGCheat.dylib" -exec cp {} SGCheat.dylib \; -quit || true
          ls -la SGCheat.dylib || echo "dylib not found at expected path"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SGCheat-deb
          path: packages/*.deb

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SGCheat-dylib
          path: SGCheat.dylib
